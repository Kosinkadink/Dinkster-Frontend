name: Prepare native generation
description: Capture the pinned official packs and dev pack in one CPU contributor generation
inputs:
  artifact:
    description: Restore the captured generation from this workflow artifact instead of rebuilding
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      if: inputs.artifact != ''
      with:
        name: ${{ inputs.artifact }}
        path: .ci/native-generation-artifact
    - name: Restore captured generation
      if: inputs.artifact != ''
      shell: bash
      run: |
        artifact="$GITHUB_WORKSPACE/.ci/native-generation-artifact"
        test "$(cat "$artifact/workspace")" = "$GITHUB_WORKSPACE"
        tar -xzf "$artifact/generation.tar.gz" -C "$GITHUB_WORKSPACE"
        cat "$artifact/generation.env" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
      if: inputs.artifact == ''
      with:
        clean: true
        persist-credentials: false
        repository: Kosinkadink/dinkster-nodes
        ref: 847c7febc6bbcfc476c0d613b520ee75b025625e
        path: .ci/dinkster-nodes
    - name: Prepare captured pack sources and interpreter
      if: inputs.artifact == ''
      shell: bash
      env:
        CUDA_VISIBLE_DEVICES: ""
        DINKSTER_ACCELERATOR: cpu
        UV_TORCH_BACKEND: cpu
      run: |
        project="$GITHUB_WORKSPACE/.ci/native-project"
        sources="$GITHUB_WORKSPACE/.ci/dinkster-nodes/packages"
        packs=(--pack-source "$GITHUB_WORKSPACE/.ci/Dinkster/packages/dinkster-nodes-dev"
          --library-source "$sources/dinkster-pack-helpers")
        for pack in "$sources"/*; do
          if [ -f "$pack/dinkster-pack.toml" ]; then
            packs+=(--pack-source "$pack")
          fi
        done
        uv run --no-project python .ci/Dinkster/scripts/develop.py --root "$project" setup --yes --port 15418 "${packs[@]}"
        uv run --no-project python .ci/Dinkster/scripts/develop.py --root "$project" stop --yes
        uv run --no-project python .ci/Dinkster/scripts/develop.py --root "$project" run -- python -c 'import os; from pathlib import Path; p = os.environ["DINKSTER_EXECUTION_PYTHON"]; print("DINKSTER_E2E_GENERATION=" + str(Path(p).parents[2])); print("DINKSTER_E2E_DINKSTER_PYTHON=" + p)' >> "$GITHUB_ENV"
    - name: Verify restored CPU interpreter and captured packs
      if: inputs.artifact != ''
      shell: bash
      env:
        CUDA_VISIBLE_DEVICES: ""
        DINKSTER_ACCELERATOR: cpu
      run: |
        "$DINKSTER_E2E_DINKSTER_PYTHON" - <<'PY'
        import os
        from pathlib import Path
        import torch
        from dinkster.generation_packs import load_generation_packs
        assert torch.__version__.endswith('+cpu') and torch.version.cuda is None
        variant, packs = load_generation_packs(Path(os.environ['DINKSTER_E2E_GENERATION']))
        assert variant == 'linux-cpu' and packs
        print(f'Restored {variant} generation with {len(packs)} captured packs')
        PY
