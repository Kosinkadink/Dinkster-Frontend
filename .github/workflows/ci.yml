name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  DINKSTER_REF: 0c86eb5fe2f734ac626a200d4b8dd4dbdf451cf0

jobs:
  fast:
    name: format, lint, types and unit subset
    needs: [visual, native-startup]
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.simulate-fork) && 'forkLinux' || 'linux'] }}
    timeout-minutes: 10
    steps:
      - name: Require product screenshots
        run: test '${{ needs.visual.result }}' = success
      - name: Require native startup on ready pull requests
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: test '${{ needs.native-startup.result }}' = success
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:fast
        env:
          DINKSTER_SOURCE_ROOT: .ci/Dinkster
      - name: Run every kept unit test on ready pull requests
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: pnpm test
        env:
          NODE_OPTIONS: --max-semi-space-size=64

  native-startup:
    name: native startup
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[github.event.pull_request.head.repo.full_name != github.repository && 'forkLinux' || 'linux'] }}
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      DINKSTER_ACCELERATOR: cpu
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project .ci/Dinkster --locked --package dinkster --no-dev
      - run: UV_PROJECT_ENVIRONMENT=.venv-torch uv sync --project .ci/Dinkster --locked --package dinkster --no-dev
      - name: Install checkout pack sources
        run: |
          packs=()
          for pack in .ci/Dinkster/packages/dinkster-nodes-*; do
            packs+=(-e "$pack")
          done
          for python in .ci/Dinkster/.venv/bin/python .ci/Dinkster/.venv-torch/bin/python; do
            uv pip install --python "$python" --no-deps --no-sources "${packs[@]}"
          done
      - run: uv pip install --python .ci/Dinkster/.venv-torch/bin/python torch --index-url https://download.pytorch.org/whl/cpu
      - run: .ci/Dinkster/.venv/bin/dinkster-pack --accelerator cpu prepare-catalogs --defaults --library-root .ci/native-library
      - run: pnpm --filter @dinkster/e2e exec playwright install chromium
      - name: Run native startup and live client tests
        run: pnpm --filter @dinkster/e2e exec playwright test --config=playwright.hosted.config.ts --project=native-startup --workers=1
        env:
          DINKSTER_E2E_DINKSTER_ROOT: ${{ github.workspace }}/.ci/Dinkster
          DINKSTER_E2E_PORT: "15410"
          DINKSTER_E2E_NATIVE_PORT: "15412"
          DINKSTER_E2E_USE_NATIVE: "1"
      - name: Retain native startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-startup
          path: |
            packages/e2e/test-results/
            .ci/live-vitest/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    name: product screenshots
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.simulate-fork) && 'forkLinux' || 'linux'] }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        timeout-minutes: 3
        run: pnpm --filter @dinkster/e2e exec playwright install chromium
      - name: Run product screenshots
        timeout-minutes: 8
        run: pnpm test:visual
        env:
          DINKSTER_E2E_PORT: "15376"
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure
          path: packages/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  bundle:
    name: Publish the tested frontend bundle
    needs: fast
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dinkster/app build
      - name: Archive the bundle
        id: archive
        run: echo "name=$(python3 scripts/bundle_artifact.py --output .ci/bundle)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: .ci/bundle/
          if-no-files-found: error
          retention-days: 90
