name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  DINKSTER_REF: a93dbaa4595de01b940c8b6ba4368408901be136

jobs:
  fast:
    name: format, lint, types and unit subset
    needs: visual
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.simulate-fork) && 'forkLinux' || 'linux'] }}
    timeout-minutes: 10
    steps:
      - name: Require product screenshots
        run: test '${{ needs.visual.result }}' = success
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:fast
        env:
          DINKSTER_SOURCE_ROOT: .ci/Dinkster
      - run: uv sync --project .ci/Dinkster --locked --package dinkster --no-dev
      - name: Install checkout pack sources
        run: |
          uv pip install --python .ci/Dinkster/.venv/bin/python --no-deps --no-sources \
            -e .ci/Dinkster/packages/dinkster-nodes-dev \
            -e .ci/Dinkster/packages/dinkster-nodes-foundation \
            -e .ci/Dinkster/packages/dinkster-nodes-image \
            -e .ci/Dinkster/packages/dinkster-nodes-media-io \
            -e .ci/Dinkster/packages/dinkster-nodes-remote \
            -e .ci/Dinkster/packages/dinkster-nodes-comfy \
            -e .ci/Dinkster/packages/dinkster-nodes-vision
      - run: .ci/Dinkster/.venv/bin/dinkster-pack --accelerator cpu prepare-catalogs --defaults --library-root .ci/native-library
        env:
          CUDA_VISIBLE_DEVICES: ""
      - name: Require every native pack to announce
        timeout-minutes: 4
        env:
          CUDA_VISIBLE_DEVICES: ""
          DINKSTER_NATIVE_BACKEND: http://127.0.0.1:15432
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.ci/Dinkster').resolve()
          with subprocess.Popen([
              str(root / '.venv/bin/dinkster-serve'),
              '--host', '127.0.0.1', '--port', '15432',
              '--engine-variant', 'linux-cpu',
              '--pack', str(root / 'packages/dinkster-nodes-dev/dinkster-pack.toml'),
              '--library-root', str(Path('.ci/native-library').resolve()),
          ], cwd=root) as backend:
              try:
                  subprocess.run([
                      'node', '--input-type=module', '-e',
                      "import wait from './packages/e2e/hosted-global-setup.ts'; await wait()",
                  ], check=True, timeout=190)
                  if backend.poll() is not None:
                      raise RuntimeError(f'Native backend exited: {backend.returncode}')
              finally:
                  backend.terminate()
                  try:
                      backend.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      backend.kill()
          PY

  visual:
    name: product screenshots
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.simulate-fork) && 'forkLinux' || 'linux'] }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        timeout-minutes: 3
        run: pnpm --filter @dinkster/e2e exec playwright install chromium
      - name: Run product screenshots
        timeout-minutes: 8
        run: pnpm test:visual
        env:
          DINKSTER_E2E_PORT: "15376"
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure
          path: packages/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  bundle:
    name: Publish the tested frontend bundle
    needs: fast
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dinkster/app build
      - name: Archive the bundle
        id: archive
        run: echo "name=$(python3 scripts/bundle_artifact.py --output .ci/bundle)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: .ci/bundle/
          if-no-files-found: error
          retention-days: 90
