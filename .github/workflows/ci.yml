name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DINKSTER_REF: 4c38857c14d33d936bdffe2e568634d1984267b9

jobs:
  fast:
    name: format, lint, types and unit subset
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.simulate-fork) && '["ubuntu-latest"]' || (vars.DINKSTER_PR_RUNNER || '["self-hosted", "linux", "x64"]')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Check private dependency access
        id: private-dependencies
        uses: ./.github/actions/check-private-dependencies
        with:
          secret-name-1: DINKSTER_REPOSITORY_DEPLOY_KEY
          secret-value-1: ${{ secrets.DINKSTER_REPOSITORY_DEPLOY_KEY }}
          force-not-run: ${{ inputs.simulate-fork }}
      - uses: ./.github/actions/configure-private-repository
        if: steps.private-dependencies.outputs.available == 'true'
        with:
          repository: Kosinkadink/Dinkster
          deploy-key: ${{ secrets.DINKSTER_REPOSITORY_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        if: steps.private-dependencies.outputs.available == 'true'
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster
      - uses: actions/setup-python@v5
        if: steps.private-dependencies.outputs.available == 'true'
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        if: steps.private-dependencies.outputs.available == 'true'
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        if: steps.private-dependencies.outputs.available == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: steps.private-dependencies.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.private-dependencies.outputs.available == 'true'
        run: pnpm ci:fast
        env:
          DINKSTER_SOURCE_ROOT: .ci/Dinkster
