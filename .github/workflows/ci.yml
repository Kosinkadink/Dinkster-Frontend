name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      simulate-fork:
        description: Run the fork pull-request policy without repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DINKSTER_REF: 8465b152af3f05370e33041523f158de8d31e139

jobs:
  fast:
    name: format, lint, types and unit subset
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || inputs.simulate-fork) && 'forkLinux' || 'linux'] }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:fast
        env:
          DINKSTER_SOURCE_ROOT: .ci/Dinkster
