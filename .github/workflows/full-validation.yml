name: Full validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6-22/2 * * *'
      timezone: America/Los_Angeles
    - cron: '43 10 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'durable' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DINKSTER_REF: a44f1acba99e1504af91208a8d9ce8c2ea162847

jobs:
  validation-plan:
    runs-on: [self-hosted, linux, x64]
    outputs:
      run-heavy: ${{ steps.plan.outputs.run-heavy }}
      e2e-matrix: ${{ steps.plan.outputs.e2e-matrix }}
    steps:
      - name: Skip an unchanged scheduled commit
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const fullMatrix = [
              { name: 'parallel 1/4', project: 'parallel-safe', shard: '--shard=1/4' },
              { name: 'parallel 2/4', project: 'parallel-safe', shard: '--shard=2/4' },
              { name: 'parallel 3/4', project: 'parallel-safe', shard: '--shard=3/4' },
              { name: 'parallel 4/4', project: 'parallel-safe', shard: '--shard=4/4', push: true },
              { name: 'backend serial 1/2', project: 'backend-serial', shard: '--shard=1/2', vulkan: true, push: true },
              { name: 'backend serial 2/2', project: 'backend-serial', shard: '--shard=2/2' },
              { name: 'performance', project: 'performance', shard: '' },
            ];
            const selected = context.eventName === 'push'
              ? fullMatrix.filter((entry) => entry.push)
              : fullMatrix;
            core.setOutput('e2e-matrix', JSON.stringify({ include: selected }));
            if (context.eventName !== 'schedule') {
              core.setOutput('run-heavy', 'true');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'full-validation.yml',
              branch: 'main',
              status: 'success',
              per_page: 100,
            });
            const latestDurable = runs.data.workflow_runs.find((run) => run.event !== 'push');
            core.setOutput('run-heavy', latestDurable?.head_sha === context.sha ? 'false' : 'true');

  fast:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/configure-dinkster-identity
        with:
          repository: Kosinkadink/Dinkster
          deploy-key: ${{ secrets.DINKSTER_REPOSITORY_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:fast
        env:
          DINKSTER_SOURCE_ROOT: .ci/Dinkster

  ci:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true' && github.event_name != 'push'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - uses: ./.github/actions/configure-dinkster-identity
        with:
          repository: Kosinkadink/Dinkster
          deploy-key: ${{ secrets.DINKSTER_REPOSITORY_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster

      - uses: ./.github/actions/configure-dinkster-identity
        with:
          deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - run: uv sync --project .ci/Dinkster --locked --package dinkster --no-dev
      - name: Verify generated fixtures are current
        env:
          DINKSTER_SOURCE_ROOT: ${{ github.workspace }}/.ci/Dinkster
        run: |
          .ci/Dinkster/.venv/bin/python .ci/Dinkster/tools/gen_extension_contribution_kinds.py --check --frontend-root .
          .ci/Dinkster/.venv/bin/python scripts/gen-dinkster-nodes-fixture.py > packages/core/fixtures/dinkster-nodes.json
          .ci/Dinkster/.venv/bin/python scripts/gen-dinkster-streams-fixture.py > packages/core/fixtures/events/dinkster-streams.json
          git diff --exit-code -- packages/core/fixtures/dinkster-nodes.json packages/core/fixtures/events/dinkster-streams.json
      - run: pnpm typecheck
      - run: pnpm check:ui-strings
      - run: '"$HOME/comfy-vibe-station/run_counted_suite.sh" pnpm test'
        env:
          # Keep allocation-heavy performance gates on steady-state work
          # instead of timing young-generation garbage collection.
          NODE_OPTIONS: --max-semi-space-size=64
      - run: pnpm --filter @dinkster/app build
      - run: pnpm --filter @dinkster/e2e exec playwright install chromium
      # Host interface changes must not invalidate Chromium's loopback requests.
      - run: bash scripts/ci-browser.sh pnpm --filter @dinkster/e2e exec playwright test --config=playwright.audit-assets.config.ts
        env:
          DINKSTER_E2E_PORT: "15376"

  e2e-suite:
    needs: validation-plan
    if: needs.validation-plan.outputs.run-heavy == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validation-plan.outputs.e2e-matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Comfy-Org/ComfyUI
          ref: 15eb748b3ec5f8a0a2d470b7fb280e2d7579f916
          path: .ci/ComfyUI

      - uses: ./.github/actions/configure-dinkster-identity
        with:
          repository: Kosinkadink/Dinkster
          deploy-key: ${{ secrets.DINKSTER_REPOSITORY_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_REF }}
          path: .ci/Dinkster

      - uses: ./.github/actions/configure-dinkster-identity
        with:
          deploy-key: ${{ secrets.DINKSTER_IDENTITY_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - run: uv venv --python 3.12 .ci/ComfyUI/venv
      - run: uv pip install --python .ci/ComfyUI/venv/bin/python torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --python .ci/ComfyUI/venv/bin/python -r .ci/ComfyUI/requirements.txt
      - run: uv sync --project .ci/Dinkster --locked --package dinkster --no-dev
      - run: .ci/Dinkster/.venv/bin/dinkster-pack --accelerator cpu prepare-catalogs --defaults --library-root .ci/native-library
        env:
          CUDA_VISIBLE_DEVICES: ""
      - run: pnpm --filter @dinkster/e2e exec playwright install chromium
      - run: dpkg-query -W -f='${Status}\n' mesa-vulkan-drivers | grep -Fx 'install ok installed'
        if: matrix.vulkan
      - run: '"$HOME/comfy-vibe-station/run_counted_suite.sh" bash scripts/ci-browser.sh pnpm --filter @dinkster/e2e exec playwright test --config=playwright.hosted.config.ts --project=${{ matrix.project }} --workers=1 ${{ matrix.shard }}'
        env:
          # Match the software Vulkan driver available on CPU-only runners.
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          DINKSTER_E2E_COMFY_ROOT: ${{ github.workspace }}/.ci/ComfyUI
          DINKSTER_E2E_DINKSTER_ROOT: ${{ github.workspace }}/.ci/Dinkster
          DINKSTER_E2E_PORT: "15410"
          DINKSTER_E2E_COMFY_PORT: "15411"
          DINKSTER_E2E_NATIVE_PORT: "15412"
          DINKSTER_E2E_USE_NATIVE: "1"
          DINKSTER_NATIVE_BACKEND: http://127.0.0.1:15412

  e2e:
    if: always() && needs.validation-plan.outputs.run-heavy == 'true'
    needs: [validation-plan, e2e-suite]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Verify every full-suite lane passed
        run: test '${{ needs.e2e-suite.result }}' = success
