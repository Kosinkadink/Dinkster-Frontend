name: Versioned frontend release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build_release.py
      - scripts/test_build_release.py
      - frontend-release.json
      - package.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest scripts/test_build_release.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dinkster/app build
      - name: Build the versioned wheel and release manifest
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          DEV_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          if [ "$DEV_RELEASE" = true ]; then args+=(--dev); fi
          python scripts/build_release.py "${args[@]}"
          (cd dist && sha256sum -c SHA256SUMS)
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          import importlib.resources
          import json
          root = importlib.resources.files('dinkster_frontend')
          release = json.loads(root.joinpath('manifest.json').read_text())
          assert release['format'] == 'dinkster.frontend/1'
          assert root.joinpath('static/index.html').read_bytes()
          assert root.joinpath('static/branding/platform/dinkster.ico').read_bytes()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'Kosinkadink/Dinkster-Frontend' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: dist
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Select the wheel for PyPI
        run: |
          mkdir wheels
          cp dist/*.whl wheels/
      - name: Record development version and exact source in an annotated tag
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('dist/frontend-manifest.json', 'utf8'));
            if (manifest.commit !== context.sha) throw new Error('Release commit mismatch');
            const tag = `main-${manifest.version}`;
            let object;
            try {
              object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
              const annotation = await github.rest.git.createTag({
                ...context.repo, tag, type: 'commit', object: context.sha,
                message: JSON.stringify({ version: manifest.version, sourceCommit: context.sha, sha256: manifest.sha256 }),
              });
              try {
                await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: annotation.data.sha });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object;
            }
            if (object.type !== 'tag') throw new Error('Release tag must be annotated');
            const annotation = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data;
            const provenance = JSON.parse(annotation.message);
            if (annotation.tag !== tag || provenance.version !== manifest.version ||
                provenance.sourceCommit !== context.sha || provenance.sha256 !== manifest.sha256) {
              throw new Error('Release tag annotation differs from the wheel provenance');
            }
            object = annotation.object;
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error('Release tag targets a different source commit');
            }
      - name: Publish the wheel to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
      - name: Publish the same files as a permanent GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Frontend $RELEASE_TAG" --generate-notes
