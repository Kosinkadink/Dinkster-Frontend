name: Versioned frontend release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build_release.py
      - frontend-release.json
      - package.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.8
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dinkster/app build
      - name: Build the versioned wheel and release manifest
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          python scripts/build_release.py "${args[@]}"
          (cd dist && sha256sum -c SHA256SUMS)
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          import importlib.resources
          import json
          root = importlib.resources.files('dinkster_frontend')
          release = json.loads(root.joinpath('manifest.json').read_text())
          assert release['format'] == 'dinkster.frontend/1'
          assert root.joinpath('static/index.html').read_bytes()
          assert root.joinpath('static/branding/platform/dinkster.ico').read_bytes()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-release
          path: dist
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Select the wheel for PyPI
        run: |
          mkdir wheels
          cp dist/*.whl wheels/
      - name: Publish the wheel to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
      - name: Publish the same files as a permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Frontend $RELEASE_TAG" --generate-notes
